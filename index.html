<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Shop Calculator Tutorial</title>
<meta name="description" content="Step-by-step video tutorial for Pro Shop Calculator: quantity x rate, description, New, Open, More, Settings, GST/PDF and Crypt.">
<style>
  :root { --bg:#f6f4ff; --fg:#1d1b2e; --card:#fff; --accent:#5b3fd9; --muted:#625f78; --line:#e2defa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14121f; --fg:#eeeaff; --card:#1e1b30; --accent:#a99bff; --muted:#aaa5c8; --line:#2f2a4a; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:20px 16px 8px; max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .lang { padding:6px 14px; border:1px solid var(--line); border-radius:999px; color:var(--fg); text-decoration:none; background:var(--card); }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  header p { margin:0; color:var(--muted); }
  main { max-width:1100px; margin:0 auto; padding:8px 16px 40px; display:grid; grid-template-columns:minmax(260px,380px) 1fr; gap:24px; align-items:start; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } .stage { position:static !important; } }
  .stage { position:sticky; top:12px; }
  video { width:100%; max-height:80vh; background:#000; border-radius:16px; display:block; }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:8px 14px; border-radius:10px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .now { margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-weight:600; }
  ol.chapters { list-style:none; margin:0; padding:0; display:grid; gap:14px; }
  .chapter { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer; overflow:hidden; }
  .chapter.active { outline:2px solid var(--accent); }
  .chapter h2 { margin:0 0 6px; font-size:1.1rem; display:flex; gap:10px; align-items:center; }
  .num { background:var(--accent); color:#fff; width:26px; height:26px; border-radius:50%; display:inline-grid; place-items:center; font-size:.85rem; flex:none; }
  .chapter ul { margin:6px 0 0; padding-left:20px; color:var(--muted); }
  .chapter li { margin:3px 0; }
  .chapter img { width:90px; border-radius:8px; float:right; margin:0 0 8px 12px; border:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div><h1>Pro Shop Calculator &mdash; Tutorial</h1>
  <p>Ten short parts with voice and subtitles. Press Play all, or pick a part.</p></div>
  <a class="lang" href="hi/" hreflang="hi" lang="hi">हिन्दी</a>
</header>
<main>
  <section class="stage">
    <video id="v" controls playsinline preload="metadata"></video>
    <div class="controls">
      <button class="primary" id="playAll">&#9654; Play all</button>
      <button id="prev">&laquo; Prev</button>
      <button id="next">Next &raquo;</button>
    </div>
    <div class="now" id="now">Pick a part to start.</div>
  </section>
  <ol class="chapters" id="list"></ol>
</main>
<script>
const parts = [
  { title:"Quantity &times; Rate, +/- and edit options",
    steps:["Type a quantity, then a rate, then press ENTER &mdash; the row shows qty &times; rate = amount.",
           "Only a quantity + ENTER: the rate is taken as 1.",
           "&plusmn; flips the sign of what you are typing (returns, discounts).",
           "Long-press a row: Edit, Insert Up, Delete, Load Data, Back.",
           "Type a value and tap a row to Insert Up, Delete Row or Edit Row."] },
  { title:"Description, Quantity &times; Rate and the Qty / Desc button",
    steps:["The header chip chooses where the cursor goes after ENTER (red dot = Quantity).",
           "Switch it to Description, enter qty and rate, press ENTER, then type the item name.",
           "Tap the chip again to return to Quantity mode."] },
  { title:"New",
    steps:["Tap New to start a fresh file with a zero total.",
           "Your earlier work stays saved in Files."] },
  { title:"Open",
    steps:["Files are grouped by day with their totals.",
           "Collapse or expand all days from the top-right arrows.",
           "Search by amount, invoice number or customer.",
           "Tap a file to load it back."] },
  { title:"More &mdash; calculation buttons",
    steps:["More shows ( ) + &minus; &times; &divide; ^ &radic; and %.",
           "Type an expression such as (2+3)*5 and press ENTER to get the result in the row.",
           "The extra keys close after use; tap More again when needed."] },
  { title:"Settings (1/2)",
    steps:["Tone: choose the key sound; the speaker icon mutes it.",
           "Language: choose from the list.",
           "Company name, address and GST appear on your invoices."] },
  { title:"Settings (2/2)",
    steps:["Customer name, address and buyer GST.",
           "Invoice prefix and suffix, with a live example of the next number.",
           "Invoice / Estimate default and the Crypto secret digit (eye icon shows or hides it).",
           "Tap Save at the top right."] },
  { title:"GST / PDF &mdash; tax, HSN, date, customer, invoice no.",
    steps:["GST-/+ : tax excluded or included. IGST/CGST : interstate or split tax.",
           "Tap a row for 0%, 5%, 12%, 18% or a custom %; All applies it to every row.",
           "Rows with a description have an HSN/SAC field.",
           "Edit the invoice number, pick the date and set the customer name."] },
  { title:"Invoice / Estimate, Share and Preview",
    steps:["Toggle between Invoice and Estimate.",
           "Share invoice: Share the PDF, or Preview it first."] },
  { title:"Crypt",
    steps:["Type a rate in ENTER RATE to get its secret code.",
           "Type or paste a code in SECRET CODE to get the rate back.",
           "Copy icons copy either value."] }
];
const base = "parts/part", v = document.getElementById('v'), now = document.getElementById('now'), list = document.getElementById('list');
const pad = n => String(n + 1).padStart(2, '0');
let cur = -1, auto = false;
parts.forEach((p, i) => {
  const li = document.createElement('li'); li.className = 'chapter'; li.id = 'c' + i;
  li.innerHTML = '<img src="' + base + pad(i) + '.jpg" alt="" loading="lazy"><h2><span class="num">' + (i + 1) + '</span>' + p.title + '</h2><ul>' + p.steps.map(s => '<li>' + s + '</li>').join('') + '</ul>';
  li.onclick = () => { auto = false; load(i, true); };
  list.appendChild(li);
});
function load(i, play) {
  if (i < 0 || i >= parts.length) return;
  cur = i; v.poster = base + pad(i) + '.jpg'; v.src = base + pad(i) + '.mp4';
  now.innerHTML = 'Part ' + (i + 1) + ' of ' + parts.length + ' &mdash; ' + parts[i].title;
  document.querySelectorAll('.chapter').forEach((e, k) => e.classList.toggle('active', k === i));
  document.getElementById('c' + i).scrollIntoView({ block:'nearest', behavior:'smooth' });
  if (play) v.play().catch(() => {});
}
v.addEventListener('ended', () => { if (auto && cur < parts.length - 1) load(cur + 1, true); });
document.getElementById('playAll').onclick = () => { auto = true; load(0, true); };
document.getElementById('prev').onclick = () => load(cur - 1, true);
document.getElementById('next').onclick = () => load(cur + 1, true);
load(0, false);
</script>
</body>
</html>
