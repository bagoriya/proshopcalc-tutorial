<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Shop Calculator वीडियो ट्यूटोरियल (हिन्दी)</title>
<meta name="description" content="Pro Shop Calculator का हिन्दी वीडियो ट्यूटोरियल: मात्रा × दर, विवरण, New, Open, More, सेटिंग्स, GST/PDF और Crypt।">
<style>
  :root { --bg:#fbf8f4; --bg2:#fff0e0; --fg:#211a14; --card:#fff; --accent:#ff7a1a; --accent2:#ffb347; --muted:#6a5c50; --line:#ecdfd1; --ink:#2a1400; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14100d; --bg2:#1d1610; --fg:#fff6ee; --card:#1e1813; --accent:#ff8a1f; --accent2:#ffb347; --muted:#cdbba9; --line:#3b2f27; --ink:#2a1400; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:Inter,"Noto Sans Devanagari","Nirmala UI",system-ui,Segoe UI,Roboto,sans-serif; background:linear-gradient(180deg,var(--bg),var(--bg2)); background-attachment:fixed; color:var(--fg); line-height:1.5; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px; }
  header.top { padding:18px 0 6px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:44px; height:44px; flex:none; border-radius:13px; display:grid; place-items:center; font-size:23px; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 8px 20px rgba(255,122,26,.35); }
  h1 { margin:0; font-size:1.35rem; line-height:1.2; }
  .brand p { margin:2px 0 0; color:var(--muted); font-size:.95rem; }
  /* language switch */
  .langs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:16px 0 4px; padding:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; box-shadow:0 8px 24px rgba(90,50,10,.10); }
  .seg { display:flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:8px 14px; border-radius:999px; font-size:1.1rem; font-weight:800; text-decoration:none; color:var(--fg); transition:transform .15s, box-shadow .15s; }
  .seg small { font-weight:600; font-size:.72rem; letter-spacing:.5px; opacity:.75; }
  .seg:hover { transform:translateY(-1px); }
  .seg.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--ink); box-shadow:0 8px 20px rgba(255,122,26,.45); }
  .seg.active::before { content:"\2713"; font-weight:900; }
  .seg:not(.active) { background:rgba(255,122,26,.08); border:2px dashed rgba(255,122,26,.55); }
  .seg:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  main { padding:12px 0 90px; display:grid; grid-template-columns:minmax(280px,400px) 1fr; gap:24px; align-items:start; }
  .stage { position:sticky; top:12px; }
  video { width:100%; max-height:76vh; background:#000; border-radius:20px; display:block; box-shadow:0 18px 44px rgba(90,50,10,.28); }
  .controls { display:grid; grid-template-columns:1fr auto auto; gap:8px; margin-top:12px; }
  button { font:inherit; font-weight:700; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:10px 16px; border-radius:14px; cursor:pointer; min-height:48px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--ink); border-color:transparent; box-shadow:0 8px 20px rgba(255,122,26,.4); font-size:1.05rem; }
  .now { margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; font-weight:700; }
  .auto { grid-column:1/-1; display:flex; align-items:center; gap:10px; color:var(--muted); font-weight:600; min-height:40px; cursor:pointer; }
  .auto input { width:22px; height:22px; accent-color:var(--accent); }
  ol.chapters { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  .chapter { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 16px; cursor:pointer; overflow:hidden; transition:transform .15s, box-shadow .15s; }
  .chapter:active { transform:scale(.99); }
  .chapter.active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 12px 28px rgba(255,122,26,.2); }
  .chapter h2 { margin:0 0 6px; font-size:1.08rem; display:flex; gap:10px; align-items:center; }
  .num { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--ink); width:30px; height:30px; border-radius:50%; display:inline-grid; place-items:center; font-size:.9rem; font-weight:800; flex:none; }
  .chapter ul { margin:6px 0 0; padding-left:20px; color:var(--muted); font-size:.95rem; }
  .chapter li { margin:3px 0; }
  .chapter img { width:84px; border-radius:10px; float:right; margin:0 0 8px 12px; border:1px solid var(--line); }
  @media (max-width:760px) {
    h1 { font-size:1.2rem; }
    main { grid-template-columns:1fr; gap:18px; padding-bottom:40px; }
    .stage { position:static; }
    video { max-height:74vh; margin:0 auto; width:auto; max-width:100%; }
    .controls { grid-template-columns:1fr 1fr; }
    .controls .primary { grid-column:1/-1; min-height:54px; }
    .chapter { padding:14px; }
    .chapter img { width:72px; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header class="top wrap">
  <div class="brand"><span class="logo">&#129518;</span><div><h1>Pro Shop Calculator</h1><p>&#2357;&#2368;&#2337;&#2367;&#2351;&#2379; &#2335;&#2381;&#2351;&#2370;&#2335;&#2379;&#2352;&#2367;&#2351;&#2354; &middot; &#2342;&#2360; &#2331;&#2379;&#2335;&#2375; &#2349;&#2366;&#2327;, &#2361;&#2367;&#2344;&#2381;&#2342;&#2368; &#2310;&#2357;&#2366;&#2332;&#2364; &#2324;&#2352; &#2360;&#2348;&#2335;&#2366;&#2311;&#2335;&#2354; &#2325;&#2375; &#2360;&#2366;&#2341;</p></div></div>
  <nav class="langs" aria-label="Language">
    <a class="seg" href="../" hreflang="en" lang="en">English</a>
    <a class="seg active" href="./" hreflang="hi" lang="hi" aria-current="page">&#2361;&#2367;&#2344;&#2381;&#2342;&#2368; <small>HINDI</small></a>
  </nav>
</header>
<main class="wrap">
  <section class="stage">
    <video id="v" controls playsinline preload="metadata"></video>
    <div class="controls">
      <button class="primary" id="playAll">&#9654; सभी चलाएँ</button>
      <button id="prev">&laquo; पिछला</button>
      <button id="next">अगला &raquo;</button>
      <label class="auto"><input type="checkbox" id="autoNext" checked> अगला भाग अपने आप चलाएँ</label>
    </div>
    <div class="now" id="now">शुरू करने के लिए कोई भाग चुनें।</div>
  </section>
  <ol class="chapters" id="list"></ol>
</main>
<script>
const parts = [
  { title:"मात्रा &times; दर, +/- और एडिट विकल्प",
    steps:["मात्रा लिखें, फिर दर लिखें और ENTER दबाएँ &mdash; पंक्ति में मात्रा &times; दर = राशि दिखती है।",
           "सिर्फ़ मात्रा लिखकर ENTER दबाने पर दर 1 मानी जाती है।",
           "&plusmn; बटन लिखी जा रही संख्या का चिह्न बदलता है (वापसी, छूट)।",
           "किसी पंक्ति को देर तक दबाएँ: Edit, Insert Up, Delete, Load Data, Back।",
           "मान लिखकर पंक्ति पर टैप करें: Insert Up, Delete Row या Edit Row।"] },
  { title:"विवरण, मात्रा &times; दर और Qty / Desc बटन",
    steps:["हेडर का चिप तय करता है कि ENTER के बाद कर्सर कहाँ जाए (लाल बिंदु = Quantity)।",
           "Description चुनें, मात्रा और दर लिखें, ENTER दबाएँ, फिर वस्तु का नाम लिखें।",
           "चिप दोबारा दबाकर Quantity मोड में लौटें।"] },
  { title:"नई फ़ाइल (New)",
    steps:["New दबाएँ, कुल राशि शून्य के साथ नई फ़ाइल खुलती है।",
           "पुराना काम Files में सुरक्षित रहता है।"] },
  { title:"फ़ाइल खोलना (Open)",
    steps:["फ़ाइलें दिन के हिसाब से और कुल राशि के साथ दिखती हैं।",
           "ऊपर दाईं ओर के तीर से सभी दिन समेटें या फैलाएँ।",
           "राशि, इनवॉइस नंबर या ग्राहक के नाम से खोजें।",
           "फ़ाइल पर टैप करके उसे वापस खोलें।"] },
  { title:"More &mdash; हिसाब के अतिरिक्त बटन",
    steps:["More में ( ) + &minus; &times; &divide; ^ &radic; और % के बटन मिलते हैं।",
           "(2+3)*5 जैसा सूत्र लिखकर ENTER दबाएँ, पंक्ति में उत्तर दिखता है।",
           "इस्तेमाल के बाद बटन बंद हो जाते हैं; ज़रूरत पर फिर More दबाएँ।"] },
  { title:"सेटिंग्स (1/2)",
    steps:["Tone से की-प्रेस की आवाज़ चुनें; स्पीकर आइकन से म्यूट करें।",
           "सूची से भाषा चुनें।",
           "कंपनी का नाम, पता और GST नंबर इनवॉइस पर दिखते हैं।"] },
  { title:"सेटिंग्स (2/2)",
    steps:["ग्राहक का नाम, पता और खरीदार का GST नंबर।",
           "इनवॉइस का प्रीफ़िक्स और सफ़िक्स, अगले नंबर के उदाहरण के साथ।",
           "Invoice / Estimate डिफ़ॉल्ट और क्रिप्टो सीक्रेट डिजिट (आँख आइकन से दिखाएँ या छिपाएँ)।",
           "ऊपर दाईं ओर Save दबाएँ।"] },
  { title:"GST / PDF &mdash; कर, HSN, तारीख, ग्राहक, इनवॉइस नंबर",
    steps:["GST-/+ : कर शामिल या अलग। IGST/CGST : अंतर्राज्यीय या बँटा हुआ कर।",
           "पंक्ति पर टैप करके 0%, 5%, 12%, 18% या अपनी दर चुनें; All सभी पंक्तियों पर लगाता है।",
           "विवरण वाली पंक्तियों में HSN/SAC का बॉक्स होता है।",
           "इनवॉइस नंबर बदलें, तारीख चुनें और ग्राहक का नाम भरें।"] },
  { title:"Invoice / Estimate, Share और Preview",
    steps:["Invoice और Estimate के बीच बदलें।",
           "Share invoice: PDF शेयर करें, या पहले Preview देखें।"] },
  { title:"Crypt",
    steps:["ENTER RATE में दर लिखें, उसका गुप्त कोड मिलता है।",
           "SECRET CODE में कोड लिखें या पेस्ट करें, दर वापस मिलती है।",
           "कॉपी आइकन से कोई भी मान कॉपी करें।"] }
];
const base = "parts/part", v = document.getElementById('v'), now = document.getElementById('now'), list = document.getElementById('list');
const pad = n => String(n + 1).padStart(2, '0');
let cur = -1;
const autoEl = document.getElementById('autoNext');
parts.forEach((p, i) => {
  const li = document.createElement('li'); li.className = 'chapter'; li.id = 'c' + i;
  li.innerHTML = '<img src="' + base + pad(i) + '.jpg" alt="" loading="lazy"><h2><span class="num">' + (i + 1) + '</span>' + p.title + '</h2><ul>' + p.steps.map(s => '<li>' + s + '</li>').join('') + '</ul>';
  li.onclick = () => { load(i, true); if (innerWidth <= 760) document.querySelector('.stage').scrollIntoView({ behavior:'smooth', block:'start' }); };
  list.appendChild(li);
});
function load(i, play) {
  if (i < 0 || i >= parts.length) return;
  cur = i; v.poster = base + pad(i) + '.jpg'; v.src = base + pad(i) + '.mp4';
  now.innerHTML = 'भाग ' + (i + 1) + ' / ' + parts.length + ' &mdash; ' + parts[i].title;
  document.querySelectorAll('.chapter').forEach((e, k) => e.classList.toggle('active', k === i));
  document.getElementById('c' + i).scrollIntoView({ block:'nearest', behavior:'smooth' });
  if (play) v.play().catch(() => {});
}
v.addEventListener('ended', () => { if (autoEl.checked && cur < parts.length - 1) load(cur + 1, true); });
document.getElementById('playAll').onclick = () => { autoEl.checked = true; load(0, true); };
document.getElementById('prev').onclick = () => load(cur - 1, true);
document.getElementById('next').onclick = () => load(cur + 1, true);
load(0, false);
</script>
</body>
</html>
